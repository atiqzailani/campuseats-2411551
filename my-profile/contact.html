      <h1>Ahmad's Profile</h1>
      <nav>
        <a href="index.html">Home</a>

        <a href="schedule.html">Schedule</a>
        <a href="food.html">Food</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <h2>Contact Me</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d63753.6587004894!2d101.65506944910663!3d2.9296856938951836!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31cdb625448e0b23%3A0x85165e8fa981af6c!2sPutrajaya!5e0!3m2!1sen!2smy!4v1791855546232!5m2!1sen!2smy"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <h3>My favourite place</h3>
      <iframe
        src="https://www.google.com/maps?q=Gombak,Selangor&output=embed"
        width="100%"
        height="300"
        loading="lazy"
        title="Map of my favourite place"
      >
      </iframe>
      <h3>Any suggestions?</h3>
      <form id="suggestion-form">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="topic">Topic</label>
        <select id="topic" name="topic">
          <option>Website</option>
          <option>Food</option>
          <option>Other</option>
        </select>
        <label for="message">Suggestion</label>
        <textarea id="message" name="message" rows="4" required></textarea>
        <button type="submit">Submit</button>
      </form>
      <p id="notice" class="notice hidden">
        Thank you! Your suggestion has been submitted.
      </p>
    </main>

    </footer>
